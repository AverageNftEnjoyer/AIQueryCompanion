name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        env:
          OPENAI_API_KEY: ci-placeholder
          OPENAI_ASSISTANT_ID: ci-placeholder
          ANALYSIS_AGENT_ID: ci-placeholder
          HARDCODE_AGENT_ID: ci-placeholder
        run: npm run build
